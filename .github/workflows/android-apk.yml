name: Build DOORA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - mobile/flutter-foundation
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform project
        working-directory: mobile
        run: flutter create --platforms=android --org com.doora --project-name doora_mobile .
      - name: Ensure release APK has internet permission
        working-directory: mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          source = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          if 'android.permission.INTERNET' not in source:
              source = re.sub(r'(<manifest[^>]*>\s*)', r'\1' + permission, source, count=1)
              manifest.write_text(source)
          print('Release manifest includes INTERNET permission:', 'android.permission.INTERNET' in manifest.read_text())
          PY
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos
      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release
      - name: Run app in Android emulator and capture home screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install mobile/build/app/outputs/flutter-apk/app-release.apk
            adb shell am start -n com.doora.doora_mobile/.MainActivity
            sleep 20
            adb shell screencap -p /sdcard/doora-home.png
            adb pull /sdcard/doora-home.png mobile/doora-home-emulator.png
      - name: Upload emulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: doora-emulator-screenshot
          path: mobile/doora-home-emulator.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: doora-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

