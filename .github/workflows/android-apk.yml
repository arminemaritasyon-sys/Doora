name: Build DOORA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - mobile/flutter-foundation
      - mobile/doora-ux-fixes
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform project
        working-directory: mobile
        run: flutter create --platforms=android --org com.doora --project-name doora_mobile .
      - name: Ensure release APK has internet permission
        working-directory: mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          source = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />' + chr(10)
          if 'android.permission.INTERNET' not in source:
              source = re.sub(r'(<manifest[^>]*>\s*)', lambda match: match.group(1) + permission, source, count=1)
              manifest.write_text(source)
          import xml.etree.ElementTree as ET
          ET.parse(manifest)
          final_source = manifest.read_text()
          assert 'android.permission.INTERNET' in final_source, 'INTERNET permission missing from release manifest'
          assert 'android.permission.POST_NOTIFICATIONS' in final_source, 'POST_NOTIFICATIONS permission missing from release manifest'
          print('Release manifest is valid XML and includes INTERNET permission')
          PY
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos
      - name: Build release APK
        working-directory: mobile
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: >-
          flutter build apk --release
          --dart-define=FIREBASE_API_KEY=$FIREBASE_API_KEY
          --dart-define=FIREBASE_APP_ID=$FIREBASE_APP_ID
          --dart-define=FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID
          --dart-define=FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: doora-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
