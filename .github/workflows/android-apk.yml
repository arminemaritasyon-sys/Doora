name: Build DOORA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - mobile/flutter-foundation
      - mobile/doora-ux-fixes
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform project
        working-directory: mobile
        run: flutter create --platforms=android --org com.doora --project-name doora_mobile .
      - name: Ensure Android notification permissions
        working-directory: mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          source = manifest.read_text()
          permissions = ['android.permission.INTERNET', 'android.permission.POST_NOTIFICATIONS', 'android.permission.VIBRATE']
          for name in permissions:
              if name not in source:
                  permission = f'    <uses-permission android:name="{name}" />' + chr(10)
                  source = re.sub(r'(<manifest[^>]*>\s*)', lambda match: match.group(1) + permission, source, count=1)
          manifest.write_text(source)
          import xml.etree.ElementTree as ET
          ET.parse(manifest)
          final_source = manifest.read_text()
          assert all(name in final_source for name in permissions), 'Android notification permissions missing'
          metadata = '''        <meta-data
              android:name="com.google.firebase.messaging.default_notification_channel_id"
              android:value="doora_updates" />'''
          if 'com.google.firebase.messaging.default_notification_channel_id' not in final_source:
              final_source = final_source.replace('</application>', metadata + chr(10) + '    </application>')
              manifest.write_text(final_source)
          activity = Path('android/app/src/main/kotlin/com/doora/doora_mobile/MainActivity.kt')
          activity_source = activity.read_text()
          activity_source = activity_source.replace(
              'import io.flutter.embedding.android.FlutterActivity',
              'import android.app.NotificationChannel\nimport android.app.NotificationManager\nimport android.content.Context\nimport android.os.Build\nimport io.flutter.embedding.android.FlutterActivity'
          )
          activity_source = activity_source.replace(
              'class MainActivity : FlutterActivity()',
              '''class MainActivity : FlutterActivity() {
              override fun onCreate(savedInstanceState: android.os.Bundle?) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel("doora_updates", "DOORA bildirimleri", NotificationManager.IMPORTANCE_HIGH).apply {
                          description = "Mesajlar, teklifler ve hesap hareketleri"
                          enableVibration(true)
                      }
                      val manager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      manager.createNotificationChannel(channel)
                  }
                  super.onCreate(savedInstanceState)
              }
          }'''
          )
          activity.write_text(activity_source)
          print('Android manifest and high-importance notification channel configured')
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos
      - name: Validate Firebase credentials
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: 1:55183080653:android:130b21ae53020877c1bd84
          FIREBASE_MESSAGING_SENDER_ID: "55183080653"
          FIREBASE_PROJECT_ID: doora-bb425
        run: |
          test -n "$FIREBASE_API_KEY" || (echo "::error::GitHub Actions secret FIREBASE_API_KEY is missing"; exit 1)
          test -n "$FIREBASE_APP_ID" || (echo "::error::GitHub Actions secret FIREBASE_APP_ID is missing"; exit 1)
          test -n "$FIREBASE_MESSAGING_SENDER_ID" || (echo "::error::GitHub Actions secret FIREBASE_MESSAGING_SENDER_ID is missing"; exit 1)
          test -n "$FIREBASE_PROJECT_ID" || (echo "::error::GitHub Actions secret FIREBASE_PROJECT_ID is missing"; exit 1)
          echo "Firebase credentials are present."
      - name: Build release APK
        working-directory: mobile
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: 1:55183080653:android:130b21ae53020877c1bd84
          FIREBASE_MESSAGING_SENDER_ID: "55183080653"
          FIREBASE_PROJECT_ID: doora-bb425
        run: >-
          flutter build apk --release
          --dart-define=FIREBASE_API_KEY=$FIREBASE_API_KEY
          --dart-define=FIREBASE_APP_ID=$FIREBASE_APP_ID
          --dart-define=FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID
          --dart-define=FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: doora-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
